
name: FastAPI CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  ci:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          python -m pytest -v

      - name: Validate Python Code
        run: |
          python -m compileall -q main.py test_main.py

      - name: Package Application
        run: |
          tar -czf fastapi-app.tar.gz main.py requirements.txt

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fastapi-app
          path: fastapi-app.tar.gz


  cd:
    name: Deploy to EC2
    needs: ci
    runs-on: [self-hosted, Linux, X64, fastapi-cd]

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: fastapi-app
          path: artifact

      - name: Deploy FastAPI Application
        run: |
          set -euo pipefail

          DEPLOY_DIR=/home/ec2-user/fastapi-app

          mkdir -p "$DEPLOY_DIR"

          tar -xzf artifact/fastapi-app.tar.gz -C "$DEPLOY_DIR"

          "$DEPLOY_DIR/venv/bin/python" -m pip install -r "$DEPLOY_DIR/requirements.txt"

          sudo -n /usr/bin/systemctl restart fastapi.service

      - name: Verify Deployment
        run: |
          curl --retry 10 \
            --retry-delay 2 \
            --retry-connrefused \
            -fsS http://127.0.0.1:8000/health
